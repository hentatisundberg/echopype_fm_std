surface_optimization:
  # Start with one annotated RAW file while expanding the search.
  max_files: 1
  search_mode: one_at_a_time
  methods: [threshold]
  max_combinations: 30
  plot_count: 5
  base_params:
    threshold:
      threshold_db: -70.0
      range_bin_fraction: 0.1
      smooth_depth_size: 5
      smooth_ping_size: 1
      closing_height: 5
      median_window: 5
      top_exclude_rows: 10
      wave_threshold_layer_db: -68.0
      layer_strength_threshold_db: -70.0
      layer_min_ping_fraction: 0.8
      layer_min_thickness_bins: 5
  penalties:
    under_penalty: 10.0
    over_penalty: 1.0
    missing_penalty: 1.0
  # Every listed parameter is varied one at a time around base_params.
  search:
    threshold:
      threshold_db: [-82.0, -78.0, -75.0]
      range_bin_fraction: [0.05, 0.1, 0.2]
      smooth_depth_size: [3, 5, 7]
      smooth_ping_size: [1, 3]
      closing_height: [3, 5, 9]
      median_window: [3, 5, 7]
      top_exclude_rows: [5, 10, 20]
      wave_threshold_layer_db: [-72.0, -68.0, -64.0]
      layer_strength_threshold_db: [-75.0, -70.0, -65.0]
      layer_min_ping_fraction: [0.6, 0.8, 0.95]
